<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101830"/>
    </linearGradient>
  </defs>

  <rect width="880" height="470" rx="10" fill="url(#bg)"/>
  <text x="24" y="32" fill="#8be9fd" font-size="15" filter="url(#glow)">$ enterprise-ai-inference-eks</text>
  <text x="24" y="50" fill="#5a6b8c" font-size="11">one request, end to end: edge -&gt; authz -&gt; router -&gt; prefill -&gt; KV transfer -&gt; decode -&gt; SSE stream back</text>

  <!-- ======================= main pipeline row ======================= -->
  <line x1="130" y1="140" x2="200" y2="140" stroke="#2a3a5c" stroke-width="2"/>
  <line x1="330" y1="140" x2="380" y2="140" stroke="#2a3a5c" stroke-width="2"/>
  <line x1="500" y1="140" x2="550" y2="140" stroke="#2a3a5c" stroke-width="2"/>
  <line x1="680" y1="140" x2="722" y2="140" stroke="#2a3a5c" stroke-width="2"/>
  <text x="140" y="131" fill="#4d5d7e" font-size="9">TLS</text>
  <text x="701" y="98" fill="#4d5d7e" font-size="9" text-anchor="middle">KV blocks</text>

  <!-- mTLS padlocks on mesh hops -->
  <g fill="#1b2944" stroke="#5a7bb0" stroke-width="1">
    <path d="M351,124 a4,4 0 0 1 8,0" fill="none"/><rect x="348" y="124" width="14" height="10" rx="2"/>
    <path d="M521,124 a4,4 0 0 1 8,0" fill="none"/><rect x="518" y="124" width="14" height="10" rx="2"/>
  </g>
  <text x="355" y="118" fill="#5a7bb0" font-size="8" text-anchor="middle">mTLS</text>
  <text x="525" y="118" fill="#5a7bb0" font-size="8" text-anchor="middle">mTLS</text>

  <!-- client -->
  <rect x="30" y="112" width="100" height="56" rx="8" fill="#121a30" stroke="#6272a4" stroke-width="1.5"/>
  <text x="80" y="136" fill="#f8f8f2" font-size="12" text-anchor="middle">client</text>
  <text x="80" y="153" fill="#5a6b8c" font-size="9" text-anchor="middle">browser / SDK</text>

  <!-- istio gateway -->
  <rect x="200" y="104" width="130" height="64" rx="8" fill="#121a30" stroke="#466BB0" stroke-width="1.5"/>
  <text x="265" y="126" fill="#7ea6e0" font-size="12" text-anchor="middle">istio gateway</text>
  <text x="265" y="143" fill="#5a6b8c" font-size="9" text-anchor="middle">NLB, SSE pass-through</text>
  <text x="265" y="157" fill="#5a6b8c" font-size="9" text-anchor="middle">idle timeout &gt; gen time</text>

  <!-- router -->
  <rect x="380" y="104" width="120" height="64" rx="8" fill="#121a30" stroke="#50fa7b" stroke-width="1.5"/>
  <text x="440" y="126" fill="#50fa7b" font-size="12" text-anchor="middle">router</text>
  <text x="440" y="143" fill="#5a6b8c" font-size="9" text-anchor="middle">admission, fair queues</text>
  <text x="440" y="157" fill="#5a6b8c" font-size="9" text-anchor="middle">prefix-hash routing</text>

  <!-- prefill pool (stacked replicas) -->
  <rect x="556" y="98" width="130" height="64" rx="8" fill="#141222" stroke="#8a5a10" stroke-width="1"/>
  <rect x="550" y="104" width="130" height="64" rx="8" fill="#1a1626" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="550" y="104" width="130" height="64" rx="8" fill="none" stroke="#ffd080" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;0.9;0.2;0.9;0.2;0.9;0;0" keyTimes="0;0.34;0.37;0.40;0.43;0.46;0.49;0.50;1"/>
  </rect>
  <text x="615" y="120" fill="#ffb84d" font-size="12" text-anchor="middle">prefill pool</text>
  <text x="615" y="136" fill="#5a6b8c" font-size="9" text-anchor="middle">p5 H100, chunked prefill</text>
  <text x="615" y="149" fill="#5a6b8c" font-size="9" text-anchor="middle">compute-bound (matmul</text>
  <text x="615" y="160" fill="#5a6b8c" font-size="9" text-anchor="middle">over all prompt tokens)</text>

  <!-- decode pool (stacked replicas) -->
  <rect x="728" y="98" width="134" height="64" rx="8" fill="#141222" stroke="#8a5a10" stroke-width="1"/>
  <rect x="722" y="104" width="134" height="64" rx="8" fill="#1a1626" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="722" y="104" width="134" height="64" rx="8" fill="none" stroke="#ffd080" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;0.8;0.3;0.8;0.3;0.8;0.3;0;0" keyTimes="0;0.60;0.65;0.70;0.75;0.80;0.85;0.90;0.95;1"/>
  </rect>
  <text x="789" y="120" fill="#ffb84d" font-size="12" text-anchor="middle">decode pool</text>
  <text x="789" y="136" fill="#5a6b8c" font-size="9" text-anchor="middle">p5e H200, FP8 W+KV</text>
  <text x="789" y="148" fill="#5a6b8c" font-size="9" text-anchor="middle">continuous batching</text>
  <!-- live KV cache gauge -->
  <text x="732" y="160" fill="#4d5d7e" font-size="8">KV</text>
  <rect x="746" y="153" width="100" height="6" rx="3" fill="#232f4d"/>
  <rect x="746" y="153" height="6" rx="3" fill="#bd93f9">
    <animate attributeName="width" dur="10s" repeatCount="indefinite"
      values="12;12;18;90;90;12" keyTimes="0;0.50;0.60;0.93;0.95;1"/>
  </rect>

  <!-- ======================= OPA under gateway ======================= -->
  <line x1="265" y1="168" x2="265" y2="200" stroke="#7178E0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="195" y="200" width="140" height="48" rx="8" fill="#121a30" stroke="#7178E0" stroke-width="1.5"/>
  <text x="265" y="220" fill="#9aa0f5" font-size="12" text-anchor="middle">OPA ext-authz</text>
  <text x="265" y="236" fill="#5a6b8c" font-size="9" text-anchor="middle">tenant, paths, token caps</text>
  <!-- authz pulse: gateway -> OPA -> gateway at 0.5s-1.4s -->
  <circle r="3.5" fill="#9aa0f5" filter="url(#glow)">
    <animateMotion path="M265,168 L265,200 L265,168" dur="10s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.14;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.13;0.14;1"/>
  </circle>

  <!-- ======================= request dot (with authz + routing pauses) ======================= -->
  <circle r="4.5" fill="#8be9fd" filter="url(#glow)">
    <animateMotion path="M80,140 L265,140 L440,140 L615,140" dur="10s" repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0;0.3458;0.3458;0.6729;0.6729;1;1"
      keyTimes="0;0.05;0.14;0.24;0.26;0.34;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="1;1;0;0" keyTimes="0;0.34;0.36;1"/>
  </circle>

  <!-- KV block transfer prefill -> decode at 5.0s-6.2s -->
  <g>
    <rect width="8" height="8" rx="1.5" fill="#FF9900" filter="url(#glow)">
      <animateMotion path="M640,140 L780,140" dur="10s" repeatCount="indefinite"
        calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.50;0.56;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.55;0.56;1"/>
    </rect>
    <rect width="8" height="8" rx="1.5" fill="#FF9900" filter="url(#glow)">
      <animateMotion path="M640,140 L780,140" dur="10s" repeatCount="indefinite"
        calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.53;0.59;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.53;0.54;0.58;0.59;1"/>
    </rect>
    <rect width="8" height="8" rx="1.5" fill="#FF9900" filter="url(#glow)">
      <animateMotion path="M640,140 L780,140" dur="10s" repeatCount="indefinite"
        calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.62;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.56;0.57;0.61;0.62;1"/>
    </rect>
  </g>

  <!-- ======================= SSE token stream back ======================= -->
  <path id="sse" d="M789,104 C 700,56 220,56 80,112" fill="none" stroke="#2a3a5c" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="430" y="64" fill="#4d5d7e" font-size="9" text-anchor="middle">SSE token stream, one token per decode step</text>
  <circle r="3" fill="#50fa7b" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.62;0.74;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.62;0.63;0.73;0.74;1"/>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.665;0.785;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.665;0.675;0.775;0.785;1"/>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.71;0.83;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.71;0.72;0.82;0.83;1"/>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.755;0.875;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.755;0.765;0.865;0.875;1"/>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.80;0.92;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.80;0.81;0.91;0.92;1"/>
  </circle>

  <!-- deny branch: a second, unauthorized request bounced at the edge (7.0s-8.6s) -->
  <circle r="4" fill="#ff5555" filter="url(#glow)">
    <animateMotion path="M80,140 L265,140 L265,224 L135,224" dur="10s" repeatCount="indefinite"
      calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.70;0.86;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.70;0.71;0.85;0.86;1"/>
  </circle>
  <text x="112" y="240" fill="#ff5555" font-size="9" opacity="0">
    429 rejected, zero GPU-seconds
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.78;0.80;0.92;0.94;1"/>
  </text>

  <!-- ======================= Karpenter GPU nodes panel ======================= -->
  <rect x="550" y="192" width="306" height="86" rx="8" fill="#0e1528" stroke="#2a3a5c" stroke-width="1"/>
  <text x="562" y="209" fill="#7ea6e0" font-size="10">Karpenter GPU nodes</text>
  <text x="845" y="275" fill="#4d5d7e" font-size="8" text-anchor="end">KEDA scales pods, Karpenter scales nodes</text>
  <!-- node 1: always on while serving -->
  <rect x="562" y="218" width="88" height="48" rx="6" fill="#121a30" stroke="#50fa7b" stroke-width="1"/>
  <text x="606" y="238" fill="#9ccfd8" font-size="9" text-anchor="middle">node-1</text>
  <text x="606" y="252" fill="#5a6b8c" font-size="8" text-anchor="middle">8x GPU, NVMe</text>
  <!-- node 2: provisioned when queue + KV pressure rise, consolidated at idle -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.42;0.47;0.95;0.99;1"/>
    <rect x="660" y="218" width="88" height="48" rx="6" fill="#121a30" stroke="#50fa7b" stroke-width="1"/>
    <text x="704" y="238" fill="#9ccfd8" font-size="9" text-anchor="middle">node-2</text>
    <text x="704" y="252" fill="#5a6b8c" font-size="8" text-anchor="middle">scaled up</text>
  </g>
  <!-- node 3: empty slot, scale-to-zero -->
  <rect x="758" y="218" width="88" height="48" rx="6" fill="none" stroke="#2a3a5c" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="802" y="238" fill="#3c4c6e" font-size="9" text-anchor="middle">empty</text>
  <text x="802" y="252" fill="#3c4c6e" font-size="8" text-anchor="middle">scale to zero</text>

  <!-- ======================= S3 model store ======================= -->
  <rect x="360" y="300" width="180" height="56" rx="8" fill="#121a30" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="322" fill="#7ea6e0" font-size="12" text-anchor="middle">S3 model store</text>
  <text x="450" y="338" fill="#5a6b8c" font-size="9" text-anchor="middle">weights pinned by hash</text>
  <text x="450" y="349" fill="#5a6b8c" font-size="8" text-anchor="middle">never :latest</text>
  <line x1="516" y1="300" x2="596" y2="268" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
  <line x1="540" y1="310" x2="692" y2="268" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="548" y="292" fill="#3b82f6" font-size="8">Mountpoint CSI, pre-pull to node NVMe</text>
  <rect width="7" height="7" rx="1.5" fill="#3b82f6" filter="url(#glow)">
    <animateMotion path="M516,297 L596,266" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect width="7" height="7" rx="1.5" fill="#3b82f6" filter="url(#glow)">
    <animateMotion path="M540,308 L692,266" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ======================= observability panel ======================= -->
  <rect x="30" y="268" width="300" height="88" rx="8" fill="#0e1528" stroke="#2a3a5c" stroke-width="1"/>
  <text x="42" y="285" fill="#7ea6e0" font-size="10">observability: Prometheus, DCGM, Grafana</text>
  <text x="42" y="300" fill="#5a6b8c" font-size="8">TTFT p95 · TPOT p99 · queue depth · KV util · hit rate</text>
  <!-- live sparkline -->
  <polyline points="42,340 66,334 90,338 114,326 138,330 162,318 186,324 210,312 234,318 258,306 282,312 306,300"
    fill="none" stroke="#50fa7b" stroke-width="1.5" stroke-dasharray="290" stroke-dashoffset="290" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="290;0;0" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite"/>
  </polyline>
  <circle r="2.5" fill="#50fa7b">
    <animateMotion path="M42,340 L66,334 L90,338 L114,326 L138,330 L162,318 L186,324 L210,312 L234,318 L258,306 L282,312 L306,300"
      dur="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="318" y="304" fill="#50fa7b" font-size="8" text-anchor="end">tok/s</text>

  <!-- ======================= phase timeline ======================= -->
  <!-- segment boundaries map 10s cycle linearly onto x 40..840 -->
  <g font-size="8">
    <rect x="40"  y="400" width="112" height="8" fill="#466BB0" opacity="0.55"/>
    <rect x="152" y="400" width="96"  height="8" fill="#50fa7b" opacity="0.35"/>
    <rect x="248" y="400" width="192" height="8" fill="#FF9900" opacity="0.45"/>
    <rect x="440" y="400" width="80"  height="8" fill="#FF9900" opacity="0.75"/>
    <rect x="520" y="400" width="280" height="8" fill="#bd93f9" opacity="0.45"/>
    <rect x="800" y="400" width="40"  height="8" fill="#2a3a5c" opacity="0.6"/>
    <text x="96"  y="422" fill="#7ea6e0" text-anchor="middle">edge + authz</text>
    <text x="200" y="422" fill="#50fa7b" text-anchor="middle">route</text>
    <text x="344" y="422" fill="#ffb84d" text-anchor="middle">prefill (compute)</text>
    <text x="480" y="422" fill="#ffb84d" text-anchor="middle">KV move</text>
    <text x="660" y="422" fill="#bd93f9" text-anchor="middle">decode (stream, one token per step)</text>
    <text x="820" y="422" fill="#4d5d7e" text-anchor="middle">idle</text>
  </g>
  <!-- TTFT / TPOT brackets -->
  <path d="M40,394 L40,390 L440,390 L440,394" fill="none" stroke="#8be9fd" stroke-width="1"/>
  <text x="240" y="386" fill="#8be9fd" font-size="9" text-anchor="middle">TTFT = queue + authz + route + prefill</text>
  <path d="M520,394 L520,390 L800,390 L800,394" fill="none" stroke="#bd93f9" stroke-width="1"/>
  <text x="660" y="386" fill="#bd93f9" font-size="9" text-anchor="middle">TPOT / ITL</text>
  <!-- time cursor synced to the 10s cycle -->
  <polygon points="-4,0 4,0 0,6" fill="#f8f8f2">
    <animateMotion path="M40,396 L840,396" dur="10s" repeatCount="indefinite" calcMode="linear"/>
  </polygon>

  <!-- footer -->
  <text x="24" y="456" fill="#2f3f61" font-size="9">strict mTLS on every hop · OPA decides before a GPU cycle is spent · KEDA on queue + KV util · Karpenter scale-to-zero · weights from S3, never the hub</text>
</svg>
