<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="980" viewBox="0 0 1064 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1064" height="980" fill="#0d1117"/>

  <rect x="0" y="0" width="1064" height="92" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="24" y="26" fill="#58a6ff" font-size="11" font-weight="bold" letter-spacing="1.5">PLATFORM ENGINEERING · REFERENCE ARCHITECTURE</text>
  <text x="24" y="52" fill="#e6edf3" font-size="22" font-weight="bold">Enterprise AI Inference on Amazon EKS</text>
  <text x="24" y="74" fill="#8b949e" font-size="12">Request path from the public internet to disaggregated vLLM GPU pools, with zero-trust mesh, edge policy, and autoscaling controls.</text>
  <text x="1040" y="30" fill="#8b949e" font-size="10" text-anchor="end">Status: Reference</text>
  <text x="1040" y="46" fill="#8b949e" font-size="10" text-anchor="end">IaC: terraform/modules</text>
  <text x="1040" y="62" fill="#8b949e" font-size="10" text-anchor="end">Owner: Platform Engineering</text>

  <!-- internet -->
  <rect x="250" y="118" width="220" height="50" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="360" y="139" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Internet</text>
  <text x="360" y="157" fill="#8b949e" font-size="10" text-anchor="middle">External API consumers</text>

  <line x1="360" y1="168" x2="360" y2="206" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="192" fill="#8b949e" font-size="10">api.example.com</text>

  <!-- nlb -->
  <rect x="235" y="210" width="250" height="52" rx="8" fill="#17304f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="231" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">AWS Network Load Balancer</text>
  <text x="360" y="249" fill="#9aa7b8" font-size="10" text-anchor="middle">Layer 4 · internet-facing · idle timeout 4000 s</text>

  <line x1="360" y1="262" x2="360" y2="336" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="372" y="300" fill="#8b949e" font-size="10">HTTPS · TLS terminated at the gateway</text>

  <!-- eks boundary -->
  <rect x="60" y="300" width="640" height="560" rx="10" fill="none" stroke="#7d8da1" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="78" y="324" fill="#7d8da1" font-size="12" font-weight="bold">Amazon EKS Cluster</text>

  <!-- gateway -->
  <rect x="235" y="340" width="250" height="52" rx="8" fill="#17304f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="361" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Istio Ingress Gateway</text>
  <text x="360" y="379" fill="#9aa7b8" font-size="10" text-anchor="middle">TLS termination · SSE pass-through</text>

  <!-- opa -->
  <line x1="485" y1="366" x2="516" y2="366" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <rect x="520" y="330" width="165" height="88" rx="8" fill="#2a2140" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="602" y="350" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">OPA ext-authz</text>
  <text x="532" y="368" fill="#9aa7b8" font-size="10">• tenant authentication</text>
  <text x="532" y="384" fill="#9aa7b8" font-size="10">• endpoint allow-list</text>
  <text x="532" y="400" fill="#9aa7b8" font-size="10">• max_tokens caps · 429 deny</text>

  <line x1="360" y1="392" x2="360" y2="448" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="424" fill="#8b949e" font-size="10">mTLS · internal service</text>

  <!-- router -->
  <text x="360" y="442" fill="#374151" font-size="12" font-weight="bold" text-anchor="middle" opacity="0">.</text>
  <rect x="130" y="452" width="460" height="116" rx="8" fill="#2a2140" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="470" y="462" width="104" height="20" rx="10" fill="#0d1117" stroke="#a78bfa" stroke-width="1"/>
  <text x="522" y="476" fill="#a78bfa" font-size="10" text-anchor="middle">2 replicas · CPU tier</text>
  <text x="146" y="478" fill="#e6edf3" font-size="13" font-weight="bold">Inference Router</text>
  <text x="146" y="495" fill="#a78bfa" font-size="10">namespace: inference</text>
  <text x="152" y="518" fill="#9aa7b8" font-size="10">• admission control, KV-aware</text>
  <text x="152" y="536" fill="#9aa7b8" font-size="10">• weighted fair queues per tenant</text>
  <text x="370" y="518" fill="#9aa7b8" font-size="10">• prefix-hash routing to warm KV</text>
  <text x="370" y="536" fill="#9aa7b8" font-size="10">• canary weights per model version</text>

  <line x1="360" y1="568" x2="252" y2="616" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="598" fill="#8b949e" font-size="10">chosen replica</text>

  <text x="385" y="608" fill="#374151" font-size="12" font-weight="bold" text-anchor="middle">Model serving tier · GPU node pools</text>

  <!-- prefill pool -->
  <rect x="110" y="620" width="260" height="132" rx="10" fill="#152b1d" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="110" y="620" width="260" height="132" rx="10" fill="none" stroke="#3fb950" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.25;0.9;0.25;0.9;0;0" keyTimes="0;0.40;0.43;0.46;0.49;0.52;0.55;0.56;1"/>
  </rect>
  <text x="240" y="644" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">vLLM · Prefill pool</text>
  <text x="240" y="666" fill="#8dd99a" font-size="10" text-anchor="middle">p5 (H100) · Karpenter gpu-prefill</text>
  <text x="240" y="684" fill="#8dd99a" font-size="10" text-anchor="middle">chunked prefill · compute-bound</text>
  <text x="240" y="702" fill="#8dd99a" font-size="10" text-anchor="middle">writes KV for every layer</text>
  <text x="240" y="720" fill="#8dd99a" font-size="10" text-anchor="middle">scale to zero when idle</text>

  <!-- decode pool -->
  <rect x="400" y="620" width="260" height="132" rx="10" fill="#152b1d" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="400" y="620" width="260" height="132" rx="10" fill="none" stroke="#3fb950" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.8;0.3;0.8;0.3;0.8;0;0" keyTimes="0;0.60;0.66;0.72;0.78;0.84;0.90;0.95;1"/>
  </rect>
  <text x="530" y="644" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">vLLM · Decode pool</text>
  <text x="530" y="666" fill="#8dd99a" font-size="10" text-anchor="middle">p5e (H200) · Karpenter gpu-decode</text>
  <text x="530" y="684" fill="#8dd99a" font-size="10" text-anchor="middle">FP8 weights + KV · continuous batching</text>
  <text x="530" y="702" fill="#8dd99a" font-size="10" text-anchor="middle">one token per step · bandwidth-bound</text>
  <text x="432" y="724" fill="#8dd99a" font-size="9">KV cache</text>
  <rect x="478" y="716" width="150" height="8" rx="4" fill="#1d3a2a"/>
  <rect x="478" y="716" height="8" rx="4" fill="#a78bfa">
    <animate attributeName="width" dur="10s" repeatCount="indefinite" values="16;16;24;132;132;16" keyTimes="0;0.52;0.60;0.93;0.95;1"/>
  </rect>

  <!-- kv transfer -->
  <line x1="370" y1="686" x2="396" y2="686" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="383" y="676" fill="#d29922" font-size="9" text-anchor="middle">KV</text>
  <rect width="8" height="8" rx="2" fill="#d29922">
    <animateMotion path="M330,686 L470,686" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.57;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.56;0.57;1"/>
  </rect>
  <rect width="8" height="8" rx="2" fill="#d29922">
    <animateMotion path="M330,686 L470,686" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.60;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.59;0.60;1"/>
  </rect>

  <!-- s3 below cluster -->
  <line x1="300" y1="886" x2="240" y2="756" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="420" y1="886" x2="530" y2="756" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="480" y="836" fill="#58a6ff" font-size="10">Mountpoint S3 CSI · weights pre-pulled to node NVMe</text>
  <rect x="235" y="890" width="250" height="56" rx="8" fill="#17304f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="912" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">S3 Model Store</text>
  <text x="360" y="930" fill="#9aa7b8" font-size="10" text-anchor="middle">versioned · KMS · weights pinned by hash</text>
  <rect width="8" height="8" rx="2" fill="#58a6ff">
    <animateMotion path="M300,884 L242,758" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect width="8" height="8" rx="2" fill="#58a6ff">
    <animateMotion path="M420,884 L528,758" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </rect>

  <!-- sse return path -->
  <path id="sse" d="M400,672 L88,672 L88,144 L246,144" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <text x="80" y="520" fill="#3fb950" font-size="10" transform="rotate(-90 80 520)" text-anchor="middle">SSE token stream back to the client</text>
  <circle r="3.5" fill="#3fb950">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.76;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.63;0.75;0.76;1"/>
  </circle>
  <circle r="3.5" fill="#3fb950">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.68;0.82;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.81;0.82;1"/>
  </circle>
  <circle r="3.5" fill="#3fb950">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.74;0.88;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.87;0.88;1"/>
  </circle>
  <circle r="3.5" fill="#3fb950">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.80;0.94;1"><mpath href="#sse"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.80;0.81;0.93;0.94;1"/>
  </circle>

  <!-- animated request dot -->
  <circle r="5" fill="#58a6ff">
    <animateMotion path="M360,150 L360,234 L360,366 L360,510 L240,686" dur="10s" repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0;0.147;0.147;0.378;0.378;0.632;0.632;1;1"
      keyTimes="0;0.04;0.07;0.13;0.22;0.30;0.33;0.40;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.40;0.42;1"/>
  </circle>
  <!-- authz pulse while request holds at the gateway -->
  <circle r="4" fill="#a78bfa">
    <animateMotion path="M485,366 L518,366 L485,366" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.13;0.22;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.13;0.14;0.21;0.22;1"/>
  </circle>

  <!-- autoscaling panel -->
  <rect x="730" y="340" width="310" height="224" rx="8" fill="#2d2306" stroke="#d29922" stroke-width="1.5"/>
  <rect x="730" y="340" width="310" height="30" rx="8" fill="#3a2d08" stroke="#d29922" stroke-width="1.5"/>
  <text x="746" y="360" fill="#e6edf3" font-size="12" font-weight="bold">Autoscaling controls</text>
  <text x="746" y="392" fill="#e6edf3" font-size="11" font-weight="bold">KEDA · pod autoscaling</text>
  <text x="746" y="409" fill="#8b949e" font-size="10">Trigger: vllm:num_requests_waiting &gt; 16</text>
  <text x="746" y="425" fill="#8b949e" font-size="10">Trigger: vllm:gpu_cache_usage_perc &gt; 0.85</text>
  <text x="746" y="441" fill="#8b949e" font-size="10">Decode scales 0 to 8 · prefill scales 0 to 8</text>
  <text x="746" y="457" fill="#8b949e" font-size="10">Scale out fast, scale in after 20 min cooldown</text>
  <text x="746" y="487" fill="#e6edf3" font-size="11" font-weight="bold">Karpenter · node provisioning</text>
  <text x="746" y="504" fill="#8b949e" font-size="10">Trigger: unschedulable GPU pod</text>
  <text x="746" y="520" fill="#8b949e" font-size="10">gpu-prefill: p5 (H100) · gpu-decode: p5e (H200)</text>
  <text x="746" y="536" fill="#8b949e" font-size="10">Bottlerocket + 1 TB NVMe · consolidation 10 min</text>
  <text x="746" y="552" fill="#8b949e" font-size="10">Empty pools consolidate to zero nodes</text>

  <path d="M730,520 L700,520 L700,660 L664,660" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowAmber)">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <text x="706" y="600" fill="#d29922" font-size="9" transform="rotate(-90 706 600)" text-anchor="middle">scales replicas + nodes</text>

  <!-- zero trust panel -->
  <rect x="730" y="588" width="310" height="156" rx="8" fill="#161b22" stroke="#7d8da1" stroke-width="1.5"/>
  <rect x="730" y="588" width="310" height="30" rx="8" fill="#21262d" stroke="#7d8da1" stroke-width="1.5"/>
  <text x="746" y="608" fill="#e6edf3" font-size="12" font-weight="bold">Zero-trust controls</text>
  <text x="746" y="640" fill="#8b949e" font-size="10">PeerAuthentication: STRICT mTLS mesh-wide</text>
  <text x="746" y="658" fill="#8b949e" font-size="10">Default-deny AuthorizationPolicy in inference</text>
  <text x="746" y="676" fill="#8b949e" font-size="10">Only legal path: gateway, router, engines</text>
  <text x="746" y="694" fill="#8b949e" font-size="10">OPA decides before a GPU cycle is spent</text>
  <text x="746" y="712" fill="#8b949e" font-size="10">Bad requests: 429 at the edge, zero GPU-seconds</text>
  <text x="746" y="730" fill="#8b949e" font-size="10">Retries: 0 on generation routes, never replayed</text>

  <!-- legend -->
  <rect x="730" y="768" width="310" height="178" rx="8" fill="#0d1117" stroke="#484f58" stroke-width="1.5"/>
  <rect x="730" y="768" width="310" height="30" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="746" y="788" fill="#e6edf3" font-size="12" font-weight="bold">Legend</text>
  <line x1="746" y1="816" x2="800" y2="816" stroke="#58a6ff" stroke-width="2"/>
  <text x="812" y="820" fill="#8b949e" font-size="10">synchronous request path (animated)</text>
  <circle cx="760" cy="842" r="3.5" fill="#3fb950"/><circle cx="776" cy="842" r="3.5" fill="#3fb950"/><circle cx="792" cy="842" r="3.5" fill="#3fb950"/>
  <text x="812" y="846" fill="#8b949e" font-size="10">SSE token stream (animated)</text>
  <line x1="746" y1="868" x2="800" y2="868" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="812" y="872" fill="#8b949e" font-size="10">authz decision (OPA ext-authz)</text>
  <line x1="746" y1="894" x2="800" y2="894" stroke="#d29922" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="812" y="898" fill="#8b949e" font-size="10">control plane signal, not request traffic</text>
  <rect x="746" y="912" width="54" height="14" fill="none" stroke="#7d8da1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="812" y="923" fill="#8b949e" font-size="10" font-style="italic">dashed boundary denotes the EKS cluster</text>

  <text x="24" y="966" fill="#6e7681" font-size="9">Generated from terraform/modules · vpc, eks, karpenter, s3, istio, opa, vllm, keda, observability</text>
</svg>
